name: Adquisicion CEN Horaria

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  adquirir:
    name: Consulta API CEN y guarda en DB
    runs-on: ubuntu-latest
    # Núcleo de lo que SÍ cambia dentro de la hora: PID (programa intra-día) +
    # CMG programado, gen-real de hoy+ayer y el barrido del día de hoy del CMG
    # online (self-heal del cron de 15 min).
    #
    # Fuera de acá, por medición (2026-08-05, corridas de 24-55 min):
    #   · PCP        → adquisicion_pcp.yml (cada 3 h). Es day-ahead y costaba
    #                  124 páginas ≈ 11 min, casi la mitad del job.
    #   · gen-real de 7 días y CMG online de AYER → self-heal en la diaria.
    #   · endpoints lentos → Adquisicion_diaria.py.
    # Con eso y la escritura por lotes el job baja a ~5 min; el timeout se deja
    # holgado igual, que es lo que detecta un cuelgue del CEN sin esperar 2 horas.
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements-adq.txt

      - name: Ejecutar adquisicion.py
        env:
          CEN_USER_KEY: ${{ secrets.CEN_USER_KEY }}
          CEN_OPS_KEY:  ${{ secrets.CEN_OPS_KEY }}
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          # Este job es el que más 429 come (19-25 por corrida, medido el
          # 2026-08-05 sobre 4 corridas seguidas): a 10-42 s de backoff cada uno,
          # el rate limiter le costaba más que todos sus fetch juntos, y llegó a
          # perder un día entero de gen-real por agotar los 3 reintentos.
          # Prevenir el 429 en origen sale mucho más barato que pagarlo después:
          # +0,5 s × ~30 requests = 15 s, contra los ~400 s de backoff.
          CEN_THROTTLE_S: "0.8"
        run: python3 Adquisicion.py

      - name: Subir log como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: log-adquisicion-${{ github.run_id }}
          path: adquisicion.log
          retention-days: 7